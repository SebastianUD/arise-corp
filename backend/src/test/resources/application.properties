# ====================================================================
# PERFIL DE PRUEBAS AISLADO DEL BACKEND (DP-TEC-02, aprobada)
# ====================================================================
# Este archivo solo se carga en el classpath de pruebas
# (src/test/resources) y sustituye la configuracion de
# src/main/resources/application.properties durante `.\mvnw.cmd test`.
#
# Objetivo: que el contexto de Spring arranque con una base H2 en
# memoria y con valores JWT ficticios, SIN conectarse a Supabase ni a
# la base compartida `arise-corp-dev` y SIN credenciales reales.
# No contiene secretos.
# Requisitos: 9.1, 9.4, NF-07, CA-03.

spring.application.name=arise-backend-test

# --------------------------------------------------------------------
# Desactivar la importacion del .env real
# --------------------------------------------------------------------
# En produccion application.properties hace
# `spring.config.import=optional:file:./.env[.properties]`. En pruebas
# no se importa ningun .env: el valor vacio deja sin efecto esa carga,
# de modo que nunca se leen credenciales reales de Supabase.
spring.config.import=

# --------------------------------------------------------------------
# DATASOURCE - H2 EN MEMORIA (reemplaza a Supabase PostgreSQL)
# --------------------------------------------------------------------
# Base efimera que vive solo durante la ejecucion de las pruebas.
# `DB_CLOSE_DELAY=-1` mantiene la base mientras haya una conexion viva
# dentro del contexto; `MODE=PostgreSQL` acerca el dialecto SQL al de
# produccion.
spring.datasource.url=jdbc:h2:mem:arise-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --------------------------------------------------------------------
# JPA / HIBERNATE
# --------------------------------------------------------------------
# `create-drop` es adecuado para una base H2 efimera: Hibernate crea el
# esquema al arrancar y lo elimina al cerrar. Hoy no hay entidades de
# negocio, por lo que no se crea ninguna tabla; cuando existan, se
# generaran automaticamente en la base de pruebas sin tocar PostgreSQL.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# --------------------------------------------------------------------
# SUPABASE AUTH - JWT (VALORES FICTICIOS, SIN RED)
# --------------------------------------------------------------------
# No se define `issuer-uri` a proposito: configurarlo haria que Spring
# Security intentara descubrir la configuracion del emisor por red al
# arrancar, lo que fallaria sin Supabase. En su lugar se declara solo
# `jwk-set-uri` (ficticio), con el que el JwtDecoder se crea de forma
# perezosa y NO realiza ninguna peticion de red al iniciar el contexto.
# Los algoritmos y la audiencia se mantienen iguales a produccion para
# que la cadena de seguridad se configure igual que en ejecucion real.
# Las pruebas de endpoints usan `SecurityMockMvcRequestPostProcessors.jwt()`
# (tokens simulados), por lo que este JWKS ficticio nunca se consulta.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/dummy-jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.audiences[0]=authenticated
